[package]
name = "smartkey-win"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-only"
description = "SmartKey Windows IME via Text Services Framework"
repository = "https://github.com/RMANOV/smartkey"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
smartkey-core = { path = "../smartkey-core" }
log = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "Win32_UI_TextServices",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "implement",
] }

[[bin]]
name = "smartkey-register"
path = "src/register.rs"
