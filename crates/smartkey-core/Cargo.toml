[package]
name = "smartkey-core"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust prediction engine: n-gram trie, Markov chain, CVM streaming counter, ensemble scorer"
repository = "https://github.com/RMANOV/smartkey"
keywords = ["predictive-text", "keyboard", "nlp", "markov", "ibus"]
categories = ["text-processing", "algorithms"]

[dependencies]
bitflags = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
arrayvec = { workspace = true }
log = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "predict"
harness = false
