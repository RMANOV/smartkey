[package]
name = "smartkey-py"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-only"
description = "PyO3 Python bindings for SmartKey prediction engine"
repository = "https://github.com/RMANOV/smartkey"

[lib]
name = "smartkey_py"
crate-type = ["cdylib"]

[dependencies]
smartkey-core = { path = "../smartkey-core" }
pyo3 = { version = "0.28", features = ["extension-module"] }
serde_json = "1"
