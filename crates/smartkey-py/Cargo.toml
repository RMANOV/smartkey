[package]
name = "smartkey-py"
version = "0.6.2"
edition = "2021"
license = "GPL-3.0-only"
description = "PyO3 Python bindings for SmartKey prediction engine"
repository = "https://github.com/RMANOV/smartkey"

[lib]
name = "smartkey_py"
crate-type = ["cdylib"]

[dependencies]
smartkey-core = { path = "../smartkey-core" }
pyo3 = { version = "0.29", features = ["extension-module"] }
