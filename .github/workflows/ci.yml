name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p smartkey-core
      - run: cargo test -p smartkey-mac
      - run: cargo test -p smartkey-playground
      - run: cargo check -p smartkey-py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test IBus adapter against current native core
        env:
          SMARTKEY_REQUIRE_NATIVE_TESTS: "1"
        run: |
          python -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --disable-pip-version-check maturin pytest
          maturin develop -m crates/smartkey-py/Cargo.toml
          python -m pytest -q ibus/

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p smartkey-core
      - run: cargo test -p smartkey-win
      - run: cargo check -p smartkey-win
      - run: cargo check -p smartkey-playground
      - run: cargo clippy -p smartkey-win -- -D warnings

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p smartkey-core
      - run: cargo test -p smartkey-mac
      - run: cargo check -p smartkey-mac
      - run: cargo check -p smartkey-playground

  bench:
    name: Benchmarks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        run: cargo bench -p smartkey-core -- --output-format bencher | tee bench-output.txt
      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-output.txt
          retention-days: 30

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p smartkey-core -p smartkey-mac -p smartkey-playground -- -D warnings
      - run: cargo clippy -p smartkey-py -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
