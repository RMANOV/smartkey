name: CI

on:
  push:
    branches: [main, master, integration/smartkey-exec.ZUDHA2Ey]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p smartkey-core
      - run: cargo test -p smartkey-mac
      - run: cargo test -p smartkey-playground
      - run: cargo check -p smartkey-py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test IBus adapter against current native core
        env:
          SMARTKEY_REQUIRE_NATIVE_TESTS: "1"
        run: |
          python -m venv "$RUNNER_TEMP/smartkey-ci-venv"
          . "$RUNNER_TEMP/smartkey-ci-venv/bin/activate"
          python -m pip install --disable-pip-version-check maturin pytest numpy scikit-learn jsonschema
          build_sha="$(git rev-parse --verify HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          SMARTKEY_BUILD_GIT_SHA="$build_sha" \
            SMARTKEY_BUILD_GIT_DIRTY=0 \
            maturin develop -m crates/smartkey-py/Cargo.toml
          SMARTKEY_EXPECT_BUILD_GIT_SHA="$build_sha" \
            SMARTKEY_EXPECT_BUILD_GIT_DIRTY=0 \
            PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q -p no:cacheprovider

  s02-offline:
    name: S02 offline import safety
    runs-on: ubuntu-latest
    env:
      SMARTKEY_DEBUG: "off"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Define runner-scoped isolated paths
        shell: bash
        run: |
          {
            printf '%s\n' "P2A_PYALLOW=$RUNNER_TEMP/p2a-pyallow"
            printf '%s\n' "P2A_BASETEMP=$RUNNER_TEMP/p2a-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-basetemp"
            printf '%s\n' "SMARTKEY_PHASEA_DATA=$RUNNER_TEMP/p2a-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-phase"
            printf '%s\n' "SMARTKEY_DEBUG_DIR=$RUNNER_TEMP/p2a-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-trace"
            printf '%s\n' "XDG_CONFIG_HOME=$RUNNER_TEMP/p2a-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-config"
            printf '%s\n' "XDG_DATA_HOME=$RUNNER_TEMP/p2a-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-data"
            printf '%s\n' "XDG_STATE_HOME=$RUNNER_TEMP/p2a-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-state"
          } >> "$GITHUB_ENV"
      - name: Require fresh isolated paths
        shell: bash
        run: |
          for path in \
            "$P2A_PYALLOW" \
            "$P2A_BASETEMP" \
            "$SMARTKEY_PHASEA_DATA" \
            "$SMARTKEY_DEBUG_DIR" \
            "$XDG_CONFIG_HOME" \
            "$XDG_DATA_HOME" \
            "$XDG_STATE_HOME"
          do
            if [ -e "$path" ] || [ -L "$path" ]; then
              echo "Refusing pre-existing S02 path: $path" >&2
              exit 1
            fi
          done
      - name: Install exact pytest allowlist
        run: |
          umask 077
          python3.14 -m pip install --disable-pip-version-check --no-compile --target "$P2A_PYALLOW" 'pytest==9.0.2'
      - name: Run focused S02 offline import safety
        run: |
          umask 077
          timeout 30s nice -n 19 python3.14 -I -S -B -c 'import os,sys; sys.path.insert(0, os.environ["P2A_PYALLOW"]); import pytest; raise SystemExit(pytest.main(["-q", "-p", "no:cacheprovider", "--basetemp", os.environ["P2A_BASETEMP"], "ibus/test_p2a_import_safety.py"]))'

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    env:
      # Keep the deliverable independent of a separately installed VC runtime.
      RUSTFLAGS: -Dwarnings -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p smartkey-core
      - run: cargo test -p smartkey-win
      - run: cargo check -p smartkey-win
      - run: cargo check -p smartkey-playground
      - run: cargo clippy -p smartkey-win -- -D warnings
      - name: Build Windows standalone payload
        run: cargo build --locked -p smartkey-win --release
      - name: Verify standalone binary dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin was not found' }
          foreach ($binary in @('smartkey-register.exe', 'smartkey_win.dll')) {
            $imports = & $dumpbin /DEPENDENTS "target/release/$binary"
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $binary" }
            $imports
            if ($imports -match '(?i)(VCRUNTIME[0-9_]*|MSVCP[0-9_]*|ucrtbase)\.dll') {
              throw "$binary still depends on a separately installed C/C++ runtime"
            }
          }
      - name: Stage complete Windows standalone payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP "smartkey-windows-standalone-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $stage) {
            throw "Refusing to reuse staging directory: $stage"
          }
          New-Item -ItemType Directory -Path $stage | Out-Null

          $payload = @(
            @{ Source = 'target/release/smartkey-register.exe'; Name = 'smartkey-register.exe' },
            @{ Source = 'target/release/smartkey_win.dll'; Name = 'smartkey_win.dll' },
            @{ Source = 'crates/smartkey-win/windows-runtime-manifest.json'; Name = 'windows-runtime-manifest.json' },
            @{ Source = 'config/smartkey.json'; Name = 'smartkey.json' },
            @{ Source = 'corpus/corpus_en.json'; Name = 'corpus_en.json' },
            @{ Source = 'corpus/corpus_bg.json'; Name = 'corpus_bg.json' },
            @{ Source = 'corpus/corpus_tech.json'; Name = 'corpus_tech.json' },
            @{ Source = 'crates/smartkey-win/packaging/Install-Machine-SmartKey.cmd'; Name = 'Install-Machine-SmartKey.cmd' },
            @{ Source = 'crates/smartkey-win/packaging/Uninstall-Machine-SmartKey.cmd'; Name = 'Uninstall-Machine-SmartKey.cmd' },
            @{ Source = 'crates/smartkey-win/packaging/Install-SmartKey.cmd'; Name = 'Install-SmartKey.cmd' },
            @{ Source = 'crates/smartkey-win/packaging/Status-SmartKey.cmd'; Name = 'Status-SmartKey.cmd' },
            @{ Source = 'crates/smartkey-win/packaging/Enable-SmartKey.cmd'; Name = 'Enable-SmartKey.cmd' },
            @{ Source = 'crates/smartkey-win/packaging/Disable-SmartKey.cmd'; Name = 'Disable-SmartKey.cmd' },
            @{ Source = 'crates/smartkey-win/packaging/Uninstall-SmartKey.cmd'; Name = 'Uninstall-SmartKey.cmd' },
            @{ Source = 'crates/smartkey-win/packaging/README-WINDOWS.md'; Name = 'README-WINDOWS.md' },
            @{ Source = 'LICENSE'; Name = 'LICENSE' },
            @{ Source = 'LICENSE-GPL'; Name = 'LICENSE-GPL' },
            @{ Source = 'LICENSE-APACHE'; Name = 'LICENSE-APACHE' }
          )
          foreach ($item in $payload) {
            if (-not (Test-Path -LiteralPath $item.Source -PathType Leaf)) {
              throw "Required payload file is missing: $($item.Source)"
            }
            Copy-Item -LiteralPath $item.Source -Destination (Join-Path $stage $item.Name)
          }

          $files = foreach ($item in $payload) {
            $staged = Join-Path $stage $item.Name
            [ordered]@{
              name = $item.Name
              repository_source = $item.Source
              sha256 = (Get-FileHash -LiteralPath $staged -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          [ordered]@{
            schema_version = 1
            source_sha = $env:GITHUB_SHA
            source_url = "https://github.com/RMANOV/smartkey/tree/$env:GITHUB_SHA"
            files = @($files)
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $stage 'artifact-source-manifest.json') -Encoding utf8NoBOM

          $expected = @($payload.Name + 'artifact-source-manifest.json' | Sort-Object)
          $actual = @(Get-ChildItem -LiteralPath $stage -File | ForEach-Object Name | Sort-Object)
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw 'Staged payload differs from the exact allowlist.'
          }
      - name: Upload Windows standalone payload
        uses: actions/upload-artifact@v4
        with:
          name: smartkey-windows-standalone
          path: ${{ runner.temp }}/smartkey-windows-standalone-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

      - name: Check machine setup and standard-user install and reversal
        id: user-smoke
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "C:\Users\Public\SmartKeySmoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $name = "SKSmoke$env:GITHUB_RUN_ATTEMPT"
          $stage = Join-Path $env:RUNNER_TEMP "smartkey-windows-standalone-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $stageHelper = Join-Path $stage 'smartkey-register.exe'
          $machineDirectory = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFiles)) 'SmartKey'
          $machineHelper = Join-Path $machineDirectory 'smartkey-register.exe'
          $guid = '{7A3B9E1F-4C2D-4E5A-8F6B-1D2E3F4A5B6C}'
          $machineClass = "HKLM:\Software\Classes\CLSID\$guid"
          $machineTip = "HKLM:\Software\Microsoft\CTF\TIP\$guid"
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The disposable runner must provide an actual elevated token for machine setup.'
          }
          if (Get-LocalUser -Name $name -ErrorAction SilentlyContinue) { throw 'Smoke account already exists' }
          foreach ($path in @($root, $machineDirectory, $machineClass, $machineTip)) {
            if (Test-Path -LiteralPath $path) { throw "Refusing preexisting smoke/machine state: $path" }
          }
          $secret = ConvertTo-SecureString ([Guid]::NewGuid().ToString('N') + 'aA!4') -AsPlainText -Force
          $credential = [PSCredential]::new("$env:COMPUTERNAME\$name", $secret)
          $created = $false
          $machineAttempted = $false
          $failure = $null
          $result = [ordered]@{
            status='NOT_RUN'; elevated_machine_token=$true
            standard_user_prerequisite=$false; standard_user_lifecycle=$false
            machine_install_exit=$null; machine_verify_exit=$null; machine_cleanup_exit=$null
            frozen_bundle_matches=$false; machine_state_removed=$false
            typing_exercised=$false; logon_exercised=$false; cleanup_errors=@()
          }
          function Invoke-MachineHelper([string]$helper, [string]$action, [string]$exitField) {
            $process = [Diagnostics.Process]::new()
            try {
              $process.StartInfo = [Diagnostics.ProcessStartInfo]::new($helper, "$action --no-dialog")
              $process.StartInfo.UseShellExecute = $false
              $process.StartInfo.CreateNoWindow = $true
              $process.StartInfo.RedirectStandardOutput = $true
              $process.StartInfo.RedirectStandardError = $true
              if (-not $process.Start()) { throw "Cannot start $action" }
              $stdout = $process.StandardOutput.ReadToEndAsync()
              $stderr = $process.StandardError.ReadToEndAsync()
              $timedOut = -not $process.WaitForExit(45000)
              if ($timedOut) {
                $process.Kill($true)
                if (-not $process.WaitForExit(5000)) { throw "$action did not exit after timeout/termination" }
              }
              $stem = $action.TrimStart('-')
              [IO.File]::WriteAllText((Join-Path $root "$stem.stdout.txt"), $stdout.GetAwaiter().GetResult())
              [IO.File]::WriteAllText((Join-Path $root "$stem.stderr.txt"), $stderr.GetAwaiter().GetResult())
              $exitCode = $process.ExitCode
              if ($null -eq $exitCode) { throw "$action has no real exit code; inferred success is refused" }
              $result[$exitField] = [int]$exitCode
              if ($timedOut) { throw "$action exceeded 45 seconds" }
              if ($exitCode -ne 0) { throw "$action failed with exit $exitCode" }
            } finally { $process.Dispose() }
          }
          function Invoke-UserSmoke([string]$phase, [string]$expectedStatus, [int]$timeout) {
            $output = Join-Path $root "user-$($phase.ToLowerInvariant())"
            $arguments = "-NoProfile -NonInteractive -File `"$script`" -Bundle `"$bundle`" -OutDir `"$output`" -Phase $phase"
            $child = Start-Process -FilePath 'powershell.exe' -ArgumentList $arguments -Credential $credential -LoadUserProfile -UseNewEnvironment -PassThru -RedirectStandardOutput (Join-Path $root "$phase.launcher.stdout.txt") -RedirectStandardError (Join-Path $root "$phase.launcher.stderr.txt")
            try {
              if (-not $child.WaitForExit($timeout)) {
                & taskkill /PID $child.Id /T /F
                throw "Standard-user $phase exceeded its bounded timeout"
              }
              $child.Refresh()
              if ($null -eq $child.ExitCode -or $child.ExitCode -ne 0) {
                throw "Standard-user $phase failed or its real exit code is unavailable: $($child.ExitCode)"
              }
            } finally { $child.Dispose() }
            $receipt = Get-Content -LiteralPath (Join-Path $output 'smoke-result.json') -Raw | ConvertFrom-Json
            if ($receipt.status -ne $expectedStatus -or $receipt.phase -ne $phase -or
                -not $receipt.standard_nonadmin -or -not $receipt.current_user_profile_confirmed -or
                -not $receipt.keyboard_defaults_preserved) {
              throw "Missing successful standard-user $phase receipt"
            }
            if ($phase -eq 'Prerequisite' -and -not $receipt.machine_prerequisite_refused) {
              throw 'Missing explicit machine-prerequisite refusal'
            }
            if ($phase -eq 'Lifecycle' -and (-not $receipt.machine_install_preserved -or -not $receipt.personal_sentinel_preserved)) {
              throw 'Lifecycle did not preserve the machine install and personal sentinel'
            }
          }
          try {
            New-Item -ItemType Directory -Path $root | Out-Null
            New-LocalUser -Name $name -Password $secret -AccountNeverExpires | Out-Null
            $created = $true
            Add-LocalGroupMember -Group (Get-LocalGroup -SID 'S-1-5-32-545').Name -Member $name
            Copy-Item -LiteralPath $stage -Destination (Join-Path $root 'bundle') -Recurse
            Copy-Item -LiteralPath 'crates/smartkey-win/packaging/smoke-user.ps1' -Destination $root
            & icacls $root /grant "${name}:(OI)(CI)M" /T /Q
            if ($LASTEXITCODE -ne 0) { throw 'Cannot grant disposable account its smoke directory' }
            $script = Join-Path $root 'smoke-user.ps1'
            $bundle = Join-Path $root 'bundle'
            Invoke-UserSmoke 'Prerequisite' 'PASS_NATIVE_STANDARD_USER_PREREQUISITE' 60000
            $result.standard_user_prerequisite = $true

            # Elevation uses the original frozen stage, never the user-writable copy.
            # Set ownership before the attempt so partial installation is cleaned too.
            $machineAttempted = $true
            Invoke-MachineHelper $stageHelper '--install-machine' 'machine_install_exit'
            $expected = @(Get-ChildItem -LiteralPath $stage -Force | ForEach-Object Name | Sort-Object)
            $actual = @(Get-ChildItem -LiteralPath $machineDirectory -Force | ForEach-Object Name | Sort-Object)
            if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
              throw 'Protected machine directory differs from the exact frozen bundle'
            }
            foreach ($file in $expected) {
              if ((Get-FileHash -LiteralPath (Join-Path $stage $file) -Algorithm SHA256).Hash -ne
                  (Get-FileHash -LiteralPath (Join-Path $machineDirectory $file) -Algorithm SHA256).Hash) {
                throw "Protected machine file differs from frozen source: $file"
              }
            }
            $result.frozen_bundle_matches = $true
            Invoke-MachineHelper $machineHelper '--verify-machine' 'machine_verify_exit'
            Invoke-UserSmoke 'Lifecycle' 'PASS_NATIVE_STANDARD_USER_MAINTENANCE' 180000
            $result.standard_user_lifecycle = $true
            $result.status = 'PASS_NATIVE_MACHINE_AND_STANDARD_USER_MAINTENANCE'
          } catch {
            $failure = $_.Exception.Message
            $result.status = 'FAIL_NATIVE_MACHINE_AND_STANDARD_USER_MAINTENANCE'
            $result['error'] = $failure
          } finally {
            if ($machineAttempted) {
              try {
                # The original archive helper can remove the installed EXE;
                # the product deliberately refuses to delete its running self.
                Invoke-MachineHelper $stageHelper '--uninstall-machine' 'machine_cleanup_exit'
                foreach ($path in @($machineClass, $machineTip, $machineDirectory)) {
                  if (Test-Path -LiteralPath $path) { throw "Owned machine state remains after cleanup: $path" }
                }
                $result.machine_state_removed = $true
              } catch { $result.cleanup_errors += "Machine cleanup: $($_.Exception.Message)" }
            }
            if ($created) {
              try { Remove-LocalUser -Name $name }
              catch { $result.cleanup_errors += "Disposable account cleanup: $($_.Exception.Message)" }
            }
            if ($result.cleanup_errors.Count -ne 0) {
              $result.status = 'FAIL_NATIVE_MACHINE_AND_STANDARD_USER_MAINTENANCE'
            }
            if (Test-Path -LiteralPath $root) {
              $result | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $root 'machine-and-user-result.json') -Encoding utf8
              Get-ChildItem -LiteralPath $root -Recurse -File | Where-Object {
                $_.Name -like '*.stdout.txt' -or $_.Name -like '*.stderr.txt' -or $_.Name -like '*result.json'
              } | Sort-Object FullName | ForEach-Object { Get-Content -LiteralPath $_.FullName }
            }
          }
          if ($null -ne $failure) { throw $failure }
          if ($result.cleanup_errors.Count -ne 0) { throw ($result.cleanup_errors -join '; ') }
      - name: Retain native standard-user result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartkey-windows-standard-user-result
          path: C:/Users/Public/SmartKeySmoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p smartkey-core
      - run: cargo test -p smartkey-mac
      - run: cargo check -p smartkey-mac
      - run: cargo check -p smartkey-playground

  bench:
    name: Benchmarks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        run: cargo bench -p smartkey-core -- --output-format bencher | tee bench-output.txt
      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-output.txt
          retention-days: 30

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p smartkey-core -p smartkey-mac -p smartkey-playground -- -D warnings
      - run: cargo clippy -p smartkey-py -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
