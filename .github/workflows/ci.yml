name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  commit-metadata:
    name: No private commit metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test commit-message gate
        run: python -m unittest discover -s tests -p 'test_no_new_private_metadata.py' -v
      - name: Scan pull-request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_commit_metadata.py --range "$BASE_SHA..$HEAD_SHA"
      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$zero_sha" ] || ! git cat-file -e "$BEFORE_SHA^{commit}"; then
            python tools/check_commit_metadata.py --range "$HEAD_SHA"
          else
            python tools/check_commit_metadata.py --range "$BEFORE_SHA..$HEAD_SHA"
          fi

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p smartkey-core
      - run: cargo test -p smartkey-mac
      - run: cargo test -p smartkey-playground
      - run: cargo check -p smartkey-py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test IBus adapter against current native core
        env:
          SMARTKEY_REQUIRE_NATIVE_TESTS: "1"
        run: |
          python -m venv "$RUNNER_TEMP/smartkey-ci-venv"
          . "$RUNNER_TEMP/smartkey-ci-venv/bin/activate"
          python -m pip install --disable-pip-version-check maturin pytest numpy scikit-learn
          build_sha="$(git rev-parse --verify HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          SMARTKEY_BUILD_GIT_SHA="$build_sha" \
            SMARTKEY_BUILD_GIT_DIRTY=0 \
            maturin develop -m crates/smartkey-py/Cargo.toml
          SMARTKEY_EXPECT_BUILD_GIT_SHA="$build_sha" \
            SMARTKEY_EXPECT_BUILD_GIT_DIRTY=0 \
            PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q -p no:cacheprovider

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p smartkey-core
      - run: cargo test -p smartkey-win
      - run: cargo check -p smartkey-win
      - run: cargo check -p smartkey-playground
      - run: cargo clippy -p smartkey-win -- -D warnings

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p smartkey-core
      - run: cargo test -p smartkey-mac
      - run: cargo check -p smartkey-mac
      - run: cargo check -p smartkey-playground

  bench:
    name: Benchmarks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        run: cargo bench -p smartkey-core -- --output-format bencher | tee bench-output.txt
      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-output.txt
          retention-days: 30

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p smartkey-core -p smartkey-mac -p smartkey-playground -- -D warnings
      - run: cargo clippy -p smartkey-py -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
