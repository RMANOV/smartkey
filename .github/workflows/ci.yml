name: CI

on:
  push:
    branches: [main, master, integration/smartkey-exec.ZUDHA2Ey]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p smartkey-core
      - run: cargo test -p smartkey-mac
      - run: cargo test -p smartkey-playground
      - run: cargo check -p smartkey-py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test IBus adapter against current native core
        env:
          SMARTKEY_REQUIRE_NATIVE_TESTS: "1"
        run: |
          python -m venv "$RUNNER_TEMP/smartkey-ci-venv"
          . "$RUNNER_TEMP/smartkey-ci-venv/bin/activate"
          python -m pip install --disable-pip-version-check maturin pytest numpy scikit-learn jsonschema
          build_sha="$(git rev-parse --verify HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          SMARTKEY_BUILD_GIT_SHA="$build_sha" \
            SMARTKEY_BUILD_GIT_DIRTY=0 \
            maturin develop -m crates/smartkey-py/Cargo.toml
          SMARTKEY_EXPECT_BUILD_GIT_SHA="$build_sha" \
            SMARTKEY_EXPECT_BUILD_GIT_DIRTY=0 \
            PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q -p no:cacheprovider

  s02-offline:
    name: S02 offline import safety
    runs-on: ubuntu-latest
    env:
      SMARTKEY_DEBUG: "off"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Define runner-scoped isolated paths
        shell: bash
        run: |
          {
            printf '%s\n' "P2A_PYALLOW=$RUNNER_TEMP/p2a-pyallow"
            printf '%s\n' "P2A_BASETEMP=$RUNNER_TEMP/p2a-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-basetemp"
            printf '%s\n' "SMARTKEY_PHASEA_DATA=$RUNNER_TEMP/p2a-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-phase"
            printf '%s\n' "SMARTKEY_DEBUG_DIR=$RUNNER_TEMP/p2a-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-trace"
            printf '%s\n' "XDG_CONFIG_HOME=$RUNNER_TEMP/p2a-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-config"
            printf '%s\n' "XDG_DATA_HOME=$RUNNER_TEMP/p2a-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-data"
            printf '%s\n' "XDG_STATE_HOME=$RUNNER_TEMP/p2a-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-state"
          } >> "$GITHUB_ENV"
      - name: Require fresh isolated paths
        shell: bash
        run: |
          for path in \
            "$P2A_PYALLOW" \
            "$P2A_BASETEMP" \
            "$SMARTKEY_PHASEA_DATA" \
            "$SMARTKEY_DEBUG_DIR" \
            "$XDG_CONFIG_HOME" \
            "$XDG_DATA_HOME" \
            "$XDG_STATE_HOME"
          do
            if [ -e "$path" ] || [ -L "$path" ]; then
              echo "Refusing pre-existing S02 path: $path" >&2
              exit 1
            fi
          done
      - name: Install exact pytest allowlist
        run: |
          umask 077
          python3.14 -m pip install --disable-pip-version-check --no-compile --target "$P2A_PYALLOW" 'pytest==9.0.2'
      - name: Run focused S02 offline import safety
        run: |
          umask 077
          timeout 30s nice -n 19 python3.14 -I -S -B -c 'import os,sys; sys.path.insert(0, os.environ["P2A_PYALLOW"]); import pytest; raise SystemExit(pytest.main(["-q", "-p", "no:cacheprovider", "--basetemp", os.environ["P2A_BASETEMP"], "ibus/test_p2a_import_safety.py"]))'

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    env:
      # Keep the deliverable independent of a separately installed VC runtime.
      RUSTFLAGS: -Dwarnings -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p smartkey-core
      - run: cargo test -p smartkey-win
      - run: cargo check -p smartkey-win
      - run: cargo check -p smartkey-playground
      - run: cargo clippy -p smartkey-win -- -D warnings
      - name: Build Windows standalone payload
        run: cargo build --locked -p smartkey-win --release
      - name: Verify standalone binary dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin was not found' }
          foreach ($binary in @('smartkey-register.exe', 'smartkey_win.dll')) {
            $imports = & $dumpbin /DEPENDENTS "target/release/$binary"
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $binary" }
            $imports
            if ($imports -match '(?i)(VCRUNTIME[0-9_]*|MSVCP[0-9_]*|ucrtbase)\.dll') {
              throw "$binary still depends on a separately installed C/C++ runtime"
            }
          }
      - name: Stage complete Windows standalone payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP "smartkey-windows-standalone-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $stage) {
            throw "Refusing to reuse staging directory: $stage"
          }
          New-Item -ItemType Directory -Path $stage | Out-Null

          $payload = @(
            @{ Source = 'target/release/smartkey-register.exe'; Name = 'smartkey-register.exe' },
            @{ Source = 'target/release/smartkey_win.dll'; Name = 'smartkey_win.dll' },
            @{ Source = 'crates/smartkey-win/windows-runtime-manifest.json'; Name = 'windows-runtime-manifest.json' },
            @{ Source = 'config/smartkey.json'; Name = 'smartkey.json' },
            @{ Source = 'corpus/corpus_en.json'; Name = 'corpus_en.json' },
            @{ Source = 'corpus/corpus_bg.json'; Name = 'corpus_bg.json' },
            @{ Source = 'corpus/corpus_tech.json'; Name = 'corpus_tech.json' },
            @{ Source = 'crates/smartkey-win/packaging/Install-SmartKey.cmd'; Name = 'Install-SmartKey.cmd' },
            @{ Source = 'crates/smartkey-win/packaging/Status-SmartKey.cmd'; Name = 'Status-SmartKey.cmd' },
            @{ Source = 'crates/smartkey-win/packaging/Enable-SmartKey.cmd'; Name = 'Enable-SmartKey.cmd' },
            @{ Source = 'crates/smartkey-win/packaging/Disable-SmartKey.cmd'; Name = 'Disable-SmartKey.cmd' },
            @{ Source = 'crates/smartkey-win/packaging/Uninstall-SmartKey.cmd'; Name = 'Uninstall-SmartKey.cmd' },
            @{ Source = 'crates/smartkey-win/packaging/README-WINDOWS.md'; Name = 'README-WINDOWS.md' },
            @{ Source = 'LICENSE'; Name = 'LICENSE' },
            @{ Source = 'LICENSE-GPL'; Name = 'LICENSE-GPL' },
            @{ Source = 'LICENSE-APACHE'; Name = 'LICENSE-APACHE' }
          )
          foreach ($item in $payload) {
            if (-not (Test-Path -LiteralPath $item.Source -PathType Leaf)) {
              throw "Required payload file is missing: $($item.Source)"
            }
            Copy-Item -LiteralPath $item.Source -Destination (Join-Path $stage $item.Name)
          }

          $files = foreach ($item in $payload) {
            $staged = Join-Path $stage $item.Name
            [ordered]@{
              name = $item.Name
              repository_source = $item.Source
              sha256 = (Get-FileHash -LiteralPath $staged -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          [ordered]@{
            schema_version = 1
            source_sha = $env:GITHUB_SHA
            source_url = "https://github.com/RMANOV/smartkey/tree/$env:GITHUB_SHA"
            files = @($files)
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $stage 'artifact-source-manifest.json') -Encoding utf8NoBOM

          $expected = @($payload.Name + 'artifact-source-manifest.json' | Sort-Object)
          $actual = @(Get-ChildItem -LiteralPath $stage -File | ForEach-Object Name | Sort-Object)
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw 'Staged payload differs from the exact allowlist.'
          }
      - name: Upload Windows standalone payload
        uses: actions/upload-artifact@v4
        with:
          name: smartkey-windows-standalone
          path: ${{ runner.temp }}/smartkey-windows-standalone-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

      - name: Check install and reversal as a standard Windows user
        id: user-smoke
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "C:\Users\Public\SmartKeySmoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $name = "SKSmoke$env:GITHUB_RUN_ATTEMPT"
          if (Get-LocalUser -Name $name -ErrorAction SilentlyContinue) { throw 'Smoke account already exists' }
          $secret = ConvertTo-SecureString ([Guid]::NewGuid().ToString('N') + 'aA!4') -AsPlainText -Force
          $credential = [PSCredential]::new("$env:COMPUTERNAME\$name", $secret)
          $created = $false
          try {
            New-LocalUser -Name $name -Password $secret -AccountNeverExpires | Out-Null
            $created = $true
            Add-LocalGroupMember -Group (Get-LocalGroup -SID 'S-1-5-32-545').Name -Member $name
            New-Item -ItemType Directory -Path $root | Out-Null
            $stage = Join-Path $env:RUNNER_TEMP "smartkey-windows-standalone-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            Copy-Item -LiteralPath $stage -Destination (Join-Path $root 'bundle') -Recurse
            Copy-Item -LiteralPath 'crates/smartkey-win/packaging/smoke-user.ps1' -Destination $root
            & icacls $root /grant "${name}:(OI)(CI)M" /T /Q
            if ($LASTEXITCODE -ne 0) { throw 'Cannot grant disposable account its smoke directory' }
            $script = Join-Path $root 'smoke-user.ps1'
            $bundle = Join-Path $root 'bundle'
            $output = Join-Path $root 'user-smoke'
            $arguments = "-NoProfile -NonInteractive -File `"$script`" -Bundle `"$bundle`" -OutDir `"$output`""
            $child = Start-Process -FilePath 'powershell.exe' -ArgumentList $arguments -Credential $credential -LoadUserProfile -UseNewEnvironment -PassThru -RedirectStandardOutput (Join-Path $root 'launcher.stdout.txt') -RedirectStandardError (Join-Path $root 'launcher.stderr.txt')
            if (-not $child.WaitForExit(180000)) {
              & taskkill /PID $child.Id /T /F
              throw 'Standard-user smoke exceeded three minutes'
            }
            $child.Refresh()
            Get-Content -LiteralPath (Join-Path $root 'launcher.stdout.txt')
            Get-Content -LiteralPath (Join-Path $root 'launcher.stderr.txt')
            if (Test-Path -LiteralPath $output) {
              Get-ChildItem -LiteralPath $output -File | ForEach-Object { Get-Content -LiteralPath $_.FullName }
            }
            if ($child.ExitCode -ne 0) { throw "Standard-user smoke failed: $($child.ExitCode)" }
            $receipt = Get-Content -LiteralPath (Join-Path $output 'smoke-result.json') -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'PASS_NATIVE_STANDARD_USER_MAINTENANCE' -or -not $receipt.standard_nonadmin) {
              throw 'Missing successful standard-user receipt'
            }
          } finally {
            if ($created) { Remove-LocalUser -Name $name }
          }
      - name: Diagnose registration in the existing runner profile
        if: failure() && steps.user-smoke.outcome == 'failure'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = "C:\Users\Public\SmartKeySmoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $helper = Join-Path $root 'bundle/smartkey-register.exe'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $elevated) { throw 'Runner-profile diagnostic requires an actual elevated token' }
          if (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'SmartKey')) {
            throw 'Refusing to alter a preexisting runner-profile SmartKey installation'
          }
          $result = [ordered]@{
            diagnostic_only=$true; standard_user_acceptance=$false
            elevated_token=$elevated; existing_runner_profile=$true
            privilege_vs_profile_history='NOT_DISTINGUISHED'
            install_exit=$null; cleanup_exit=$null
            token_integrity_sid=$null; enable_lua=$null
            machine_com_control='NOT_RUN'; machine_verify_exit=$null
            copied_dll_sha256=$null; diagnostic_error=$null; cleanup_errors=@()
            machine_class_removed=$null; machine_directory_removed=$null
          }
          $machineClassCreated = $false
          $machineDirectoryCreated = $false
          $guid = '{7A3B9E1F-4C2D-4E5A-8F6B-1D2E3F4A5B6C}'
          $machineClass = "HKLM:\Software\Classes\CLSID\$guid"
          $machineDirectory = Join-Path $env:ProgramFiles "SmartKey-COM-Diagnostic-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          try {
            & $helper --install --no-dialog 1> (Join-Path $root 'control-install.stdout.txt') 2> (Join-Path $root 'control-install.stderr.txt')
            $result.install_exit = $LASTEXITCODE
            # Read only this candidate's identities before its cleanup.
            $snapshots = foreach ($path in @(
              "HKCU:\Software\Microsoft\CTF\TIP\$guid",
              "HKLM:\Software\Microsoft\CTF\TIP\$guid",
              "HKCU:\Software\Classes\CLSID\$guid",
              "HKLM:\Software\Classes\CLSID\$guid"
            )) {
              if (-not (Test-Path -LiteralPath $path)) {
                [ordered]@{ path=$path; present=$false }
                continue
              }
              $keys = @((Get-Item -LiteralPath $path)) + @(Get-ChildItem -LiteralPath $path -Recurse)
              foreach ($key in $keys) {
                $values = [ordered]@{}
                foreach ($name in $key.GetValueNames()) { $values[$name] = $key.GetValue($name) }
                [ordered]@{ path=$key.Name; present=$true; values=$values }
              }
            }
            @($snapshots) | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $root 'control-owned-registry.json') -Encoding utf8
            # One diagnostic for elevated COM visibility; baseline evidence above
            # is retained, and this cannot accept a standard-user installation.
            if ($result.install_exit -ne 0) {
              $groups = & "$env:SystemRoot\System32\whoami.exe" /groups /fo csv /nh
              if ($LASTEXITCODE -ne 0) { throw 'Cannot read diagnostic token integrity' }
              $integrity = [regex]::Match(($groups -join "`n"), 'S-1-16-[0-9]+')
              if (-not $integrity.Success) { throw 'Diagnostic token integrity SID was not reported' }
              $result.token_integrity_sid = $integrity.Value
              $result.enable_lua = (Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableLUA).EnableLUA
              if (Test-Path -LiteralPath $machineClass) {
                throw 'Refusing preexisting exact SmartKey machine COM class'
              }
              if (Test-Path -LiteralPath $machineDirectory) {
                throw 'Refusing preexisting diagnostic Program Files directory'
              }
              New-Item -ItemType Directory -Path $machineDirectory | Out-Null
              $machineDirectoryCreated = $true
              $machineDll = Join-Path $machineDirectory 'smartkey_win.dll'
              $sourceDll = Join-Path $env:LOCALAPPDATA 'SmartKey/smartkey_win.dll'
              Copy-Item -LiteralPath $sourceDll -Destination $machineDll
              $sourceHash = (Get-FileHash -LiteralPath $sourceDll -Algorithm SHA256).Hash
              $result.copied_dll_sha256 = (Get-FileHash -LiteralPath $machineDll -Algorithm SHA256).Hash
              if ($result.copied_dll_sha256 -ne $sourceHash) { throw 'Diagnostic DLL copy differs from installed DLL' }
              # No TSF catalog or profile parameters are changed here.
              New-Item -Path $machineClass | Out-Null
              $machineClassCreated = $true
              $serverKey = Join-Path $machineClass 'InProcServer32'
              New-Item -Path $serverKey | Out-Null
              Set-Item -LiteralPath $serverKey -Value $machineDll
              New-ItemProperty -LiteralPath $serverKey -Name ThreadingModel -Value Apartment -PropertyType String | Out-Null
              $process = [Diagnostics.Process]::new()
              try {
                $process.StartInfo = [Diagnostics.ProcessStartInfo]::new($helper, '--verify --no-dialog')
                $process.StartInfo.UseShellExecute = $false
                $process.StartInfo.CreateNoWindow = $true
                $process.StartInfo.RedirectStandardOutput = $true
                $process.StartInfo.RedirectStandardError = $true
                if (-not $process.Start()) { throw 'Cannot start machine COM verification child' }
                $stdout = $process.StandardOutput.ReadToEndAsync()
                $stderr = $process.StandardError.ReadToEndAsync()
                if (-not $process.WaitForExit(45000)) {
                  $process.Kill($true)
                  if (-not $process.WaitForExit(5000)) { throw 'Machine COM verification child did not stop after timeout' }
                  $result.machine_com_control = 'TIMEOUT'
                }
                $stdout.GetAwaiter().GetResult() | Set-Content -LiteralPath (Join-Path $root 'control-machine-com.stdout.txt') -Encoding utf8
                $stderr.GetAwaiter().GetResult() | Set-Content -LiteralPath (Join-Path $root 'control-machine-com.stderr.txt') -Encoding utf8
                $result.machine_verify_exit = $process.ExitCode
                if ($result.machine_com_control -ne 'TIMEOUT') {
                  $result.machine_com_control = if ($process.ExitCode -eq 0) { 'QUERY_SUCCEEDED_DIAGNOSTIC_ONLY' } else { 'QUERY_FAILED' }
                }
              } finally { $process.Dispose() }
            }
          } catch {
            $result.diagnostic_error = $_.Exception.Message
            if ($result.machine_com_control -eq 'NOT_RUN') { $result.machine_com_control = 'CONTROL_ERROR' }
          } finally {
            # Remove only objects this diagnostic created, even if query failed.
            if ($machineClassCreated) {
              try {
                Remove-Item -LiteralPath $machineClass -Recurse -Force
                $result.machine_class_removed = -not (Test-Path -LiteralPath $machineClass)
                if (-not $result.machine_class_removed) { throw 'Created machine COM class remains' }
              } catch { $result.cleanup_errors += "Machine COM class: $($_.Exception.Message)" }
            }
            if ($machineDirectoryCreated) {
              try {
                Remove-Item -LiteralPath $machineDirectory -Recurse -Force
                $result.machine_directory_removed = -not (Test-Path -LiteralPath $machineDirectory)
                if (-not $result.machine_directory_removed) { throw 'Created diagnostic directory remains' }
              } catch { $result.cleanup_errors += "Diagnostic directory: $($_.Exception.Message)" }
            }
            # Existing exact SmartKey helper cleanup remains unconditional.
            try {
              & $helper --uninstall --no-dialog 1> (Join-Path $root 'control-cleanup.stdout.txt') 2> (Join-Path $root 'control-cleanup.stderr.txt')
              $result.cleanup_exit = $LASTEXITCODE
              if ($result.cleanup_exit -ne 0) { $result.cleanup_errors += "Helper cleanup exit: $($result.cleanup_exit)" }
            } catch { $result.cleanup_errors += "Helper cleanup: $($_.Exception.Message)" }
            $result | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $root 'control-result.json') -Encoding utf8
            if (Test-Path -LiteralPath (Join-Path $root 'control-install.stderr.txt')) {
              Get-Content -LiteralPath (Join-Path $root 'control-install.stderr.txt')
            }
            if (Test-Path -LiteralPath (Join-Path $root 'control-machine-com.stderr.txt')) {
              Get-Content -LiteralPath (Join-Path $root 'control-machine-com.stderr.txt')
            }
            Get-Content -LiteralPath (Join-Path $root 'control-result.json')
          }
      - name: Retain native standard-user result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartkey-windows-standard-user-result
          path: C:/Users/Public/SmartKeySmoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p smartkey-core
      - run: cargo test -p smartkey-mac
      - run: cargo check -p smartkey-mac
      - run: cargo check -p smartkey-playground

  bench:
    name: Benchmarks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        run: cargo bench -p smartkey-core -- --output-format bencher | tee bench-output.txt
      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-output.txt
          retention-days: 30

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p smartkey-core -p smartkey-mac -p smartkey-playground -- -D warnings
      - run: cargo clippy -p smartkey-py -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
